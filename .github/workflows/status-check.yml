name: Status check

# The outside status checker for the A&B website. The app can't report its
# own outage, so this asks from outside what a visitor and a click depend on:
# the site's /api/health, its home page, the tracking host once there is one,
# the privacy page the carrier cites on both of the company's names, and each
# certificate's days left. A failure is asked again 90 seconds later
# and fails the run only if it repeats; scripts/status_check.py emails
# STATUS_ALERT_TO over the company SMTP server when a failure starts, every
# four hours while it lasts, and once the site has passed again for 30
# minutes. With the secret STATUS_CHECK_TOKEN (made on the site's Settings ->
# Monitoring), it also posts each run's result to the site's /api/status-check
# for the dashboard; a report the site refuses is logged and fails nothing.
#
# cron-job.org starts it every five minutes through workflow_dispatch, with a
# fine-grained token that can do nothing but Actions in this repository. The
# schedule below is the backstop: on its own GitHub ran it only 2.5 to 7.8
# hours apart (29 September to 5 October 2026), since it delays scheduled
# runs under load and drops some. The concurrency group keeps the two from
# overlapping.
#
# The script finds its earlier runs through this file's name: keep it
# status-check.yml. The job is skipped, and a skipped job takes no runner,
# until the repository variable STATUS_CHECK_SITE_URL is set.

on:
  schedule:
    # The backstop, should the trigger stop: every five minutes, GitHub's
    # shortest, though in practice hours apart.
    - cron: "*/5 * * * *"
  workflow_dispatch:   # how cron-job.org starts it, every five minutes

permissions:
  contents: read   # the checkout
  actions: read    # this workflow's earlier runs, the checker's only memory

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    name: Check the site from outside
    if: ${{ vars.STATUS_CHECK_SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Check the site
        # Standard library only, so nothing is installed. The script reads this
        # step's result in earlier runs by its name: rename both together.
        env:
          STATUS_CHECK_SITE_URL: ${{ vars.STATUS_CHECK_SITE_URL }}
          STATUS_CHECK_TRACKING_URL: ${{ vars.STATUS_CHECK_TRACKING_URL }}
          # The carrier's reputation enrolment for every recruiter number cites
          # this page, so it is watched on both names like a health endpoint,
          # through the company site's move to its new host too. A literal, so
          # no repository setting needs changing.
          STATUS_CHECK_PRIVACY_URLS: https://ashfordbriggs.com/privacy.html https://www.ashfordbriggs.com/privacy.html
          STATUS_ALERT_TO: ${{ vars.STATUS_ALERT_TO }}
          STATUS_SMTP_HOST: ${{ secrets.STATUS_SMTP_HOST }}
          STATUS_SMTP_PORT: ${{ secrets.STATUS_SMTP_PORT }}
          STATUS_SMTP_USERNAME: ${{ secrets.STATUS_SMTP_USERNAME }}
          STATUS_SMTP_PASSWORD: ${{ secrets.STATUS_SMTP_PASSWORD }}
          STATUS_SMTP_FROM: ${{ secrets.STATUS_SMTP_FROM }}
          STATUS_CHECK_TOKEN: ${{ secrets.STATUS_CHECK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/status_check.py
